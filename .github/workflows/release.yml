name: Release

# Push a tag like v0.1.0 to build the Windows exe and installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag matches the app and installer versions
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION = \"$v\"" unirgb/app.py && grep -q "AppVersion \"$v\"" installer/UniRGB.iss || {
            echo "::error::Tag $GITHUB_REF_NAME must match VERSION in unirgb/app.py and AppVersion in installer/UniRGB.iss"; exit 1; }

      - run: python -m unittest discover -s tests -t .

      - name: Install build tools
        shell: cmd
        run: |
          call tools\install-pyinstaller.cmd || exit /b 1
          choco install innosetup -y --no-progress

      - name: Build
        shell: cmd
        run: tools\build-windows.cmd

      - name: Portable zip
        shell: bash
        working-directory: dist
        run: 7z a "UniRGB-${GITHUB_REF_NAME#v}-portable.zip" ./UniRGB/*

      # sha256sum fails if build-windows.cmd skipped the installer, so a release never ships without it.
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha256sum "UniRGB-Setup-$v.exe" "UniRGB-$v-portable.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "UniRGB $GITHUB_REF_NAME" --generate-notes
          "dist/UniRGB-Setup-${GITHUB_REF_NAME#v}.exe" "dist/UniRGB-${GITHUB_REF_NAME#v}-portable.zip" dist/SHA256SUMS.txt
